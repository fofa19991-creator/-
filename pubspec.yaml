name: ai_teacher_assistant
description: "منصة المساعد الذكي للمعلم - تطبيق متكامل بالذكاء الاصطناعي للمنهج السعودي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_generative_ai: ^0.2.2
  flutter_riverpod: ^2.5.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
